<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="../css/styles.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=DM+Sans:wght@400;500&display=swap"
        rel="stylesheet" />
</head>

<body>

    <!-- ===== NAVBAR ===== -->
    <header>
        <nav class="navbar navbar-expand-lg miNav">
            <div class="container-fluid">

                <a class="navbar-brand" href="../index.html">Jimena Monzon</a>

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Abrir menú de navegación">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto align-items-lg-center">
                        <li class="nav-item">
                            <a class="nav-link" href="../index.html">Inicio</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="inscribite.html">Inscribite</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="sobreMi.html">Sobre mí</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="contacto.html">Contacto</a>
                        </li>
                    </ul>
                </div>

            </div>
        </nav>
    </header>

    <!-- ===== MAIN ===== -->
    <main>

        <section class="contInscripcion">

            <h1>Inscripción a Clases de Pilates</h1>

            <form class="formPilates" action="#" method="POST" novalidate>

                <div class="form-grupo">
                    <label for="nombre">Nombre completo</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Ingresá tu nombre" required />
                </div>

                <div class="form-grupo">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Ingresá tu email" required />
                </div>

                <div class="form-grupo">
                    <label for="telefono">Teléfono</label>
                    <input type="tel" id="telefono" name="telefono" placeholder="Ingresá tu teléfono" required />
                </div>

                <div class="form-grupo">
                    <label for="edad">Edad</label>
                    <input type="number" id="edad" name="edad" placeholder="Tu edad" min="10" max="99" required />
                </div>

                <div class="form-grupo">
                    <label for="dias">Días de asistencia</label>
                    <select id="dias" name="dias" required>
                        <option value="" disabled selected>Seleccioná una opción</option>
                        <option value="1">1 día</option>
                        <option value="2">2 días</option>
                        <option value="3">3 días</option>
                        <option value="completa">Semana completa</option>
                    </select>
                </div>

                <div class="form-grupo">
                    <label for="patologia">Patología, lesiones, etc. <span>(opcional)</span></label>
                    <textarea id="patologia" name="patologia" rows="4"
                        placeholder="Contanos si tenés alguna lesión o consulta"></textarea>
                </div>

                <button type="submit">Inscribirme</button>

            </form>

        </section>

    </main>

    <!-- ===== FOOTER ===== -->
    <footer>
        <p>Dirección: Calle Falsa 123</p>
        <p>Teléfono: 0303-456</p>
        <p>Corrientes, Argentina</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
